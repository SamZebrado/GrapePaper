name: Temporary preview build
on:
  push:
    branches: [grapepaper-preview-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:all
      - run: npm run typecheck
      - run: npm run lint:reading
      - run: npm run build:pages
      - name: Commit generated Pages files
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo 'Generated docs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Temporary generated Pages preview'
          git push origin HEAD:grapepaper-preview-build
