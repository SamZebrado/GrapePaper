name: Public preview smoke test
on:
  push:
    branches: [grapepaper-preview-build]
permissions:
  contents: read
jobs:
  public-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test deployed GitHub Pages
        env:
          GRAPEPAPER_TEST_URL: https://samzebrado.github.io/GrapePaper/
        run: npm run test:e2e
